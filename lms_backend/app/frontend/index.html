<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos en Línea</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Plataforma Cursos en Línea</h1>

    <!-- Sección de Usuarios -->
    <section id="users-section">
        <h2>Registrar Usuario</h2>
        <form id="user-form">
            <input type="text" id="user-name" placeholder="Nombre completo" required>
            <input type="email" id="user-email" placeholder="Correo electrónico" required>
            <select id="user-role">
                <option value="student">Estudiante</option>
                <option value="instructor">Instructor</option>
            </select>
            <button type="submit">Guardar Usuario</button>
        </form>

        <h3>Lista de Usuarios</h3>
        <ul id="users-list"></ul>
    </section>

    <!-- Script principal usando ES Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
